<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素大戰：全球即時共繪畫布 (r/place Clone)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        /* 保持像素點絕對清晰不模糊 */
        canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* 美化滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col md:flex-row overflow-hidden select-none">

    <!-- ==========================================
        左側：控制台 & 陣營資訊 & 聊天室
       ========================================== -->
    <div class="w-full md:w-96 flex flex-col bg-slate-900 border-r border-slate-800 shadow-2xl shrink-0 z-20 h-2/5 md:h-full">
        <!-- 頂部 Header -->
        <div class="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🎨</span>
                <div>
                    <h1 class="text-sm font-bold tracking-wider text-cyan-400 pixel-font">r/place CLONE</h1>
                    <p class="text-[10px] text-slate-400 mt-1">即時共繪萬人沙盒</p>
                </div>
            </div>
            <!-- 音效切換 -->
            <button id="btn-sound" class="px-2.5 py-1.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800 text-xs transition-colors hover:bg-cyan-900">
                🔊 音效: 開
            </button>
        </div>

        <!-- 使用者設定卡片 -->
        <div class="p-4 bg-slate-900/50 border-b border-slate-800 space-y-3">
            <div class="text-[10px] font-bold text-slate-500 tracking-wider uppercase pixel-font">ID & FACTION</div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[9px] text-slate-500 block mb-1">玩家暱稱</label>
                    <input id="input-username" type="text" maxlength="12" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-cyan-300 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="text-[9px] text-slate-500 block mb-1">所屬陣營</label>
                    <input id="input-faction" type="text" maxlength="10" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-yellow-300 focus:outline-none focus:border-yellow-500">
                </div>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-[10px] text-slate-500">陣營代表色:</span>
                    <input id="input-faction-color" type="color" value="#00D3DD" class="w-7 h-5 bg-transparent border-0 cursor-pointer">
                </div>
                <div class="text-[10px] text-slate-500">
                    連線狀態: <span id="sync-status" class="text-amber-400">連線中...</span>
                </div>
            </div>
        </div>

        <!-- 三分切換標籤 -->
        <div class="flex border-b border-slate-800 text-xs font-bold bg-slate-950">
            <button id="tab-chat" class="flex-1 py-3 text-center border-b-2 border-cyan-500 text-cyan-400 bg-slate-900/40">
                💬 陣營外交
            </button>
            <button id="tab-activity" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200">
                ⚡ 落筆活動
            </button>
            <button id="tab-leaderboard" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200">
                🏆 領土佔比
            </button>
        </div>

        <!-- 內容容器 -->
        <div class="flex-1 overflow-y-auto p-4 relative min-h-0">
            <!-- A. 聊天室 -->
            <div id="panel-chat" class="flex flex-col h-full justify-between">
                <div id="chat-messages" class="space-y-2 overflow-y-auto flex-1 pr-1 max-h-[160px] md:max-h-none">
                    <!-- 訊息將動態插入 -->
                </div>
                <form id="chat-form" class="mt-3 pt-2 border-t border-slate-800 flex gap-1.5 shrink-0">
                    <input id="chat-input" type="text" placeholder="輸入盟軍外交訊息..." maxlength="50" required
                           class="flex-1 bg-slate-950 border border-slate-700 rounded px-2.5 py-2 text-xs focus:outline-none focus:border-cyan-500">
                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-extrabold px-4 py-2 rounded text-xs transition-colors">
                        發送
                    </button>
                </form>
            </div>

            <!-- B. 活動紀錄 -->
            <div id="panel-activity" class="hidden space-y-2">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider pixel-font">LIVE LOGS</h3>
                <div id="activity-list" class="space-y-1.5 text-xs">
                    <!-- 活動紀錄將動態插入 -->
                </div>
            </div>

            <!-- C. 陣營領土 -->
            <div id="panel-leaderboard" class="hidden space-y-3">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider pixel-font">TERRITORIES</h3>
                <div id="leaderboard-list" class="space-y-2">
                    <!-- 領土佔有排行榜動態插入 -->
                </div>
            </div>
        </div>

        <!-- 底層說明 -->
        <div class="p-4 border-t border-slate-800 bg-slate-950 text-[10px] text-slate-500 space-y-1 shrink-0">
            <div class="font-bold text-slate-400">💡 快捷操作說明：</div>
            <div>• 滑鼠滾輪：自由放大或縮小畫布。</div>
            <div>• <kbd class="px-1 bg-slate-900 rounded border border-slate-800">Shift</kbd> + 滑鼠拖曳：可自由移動視野。</div>
            <div>• 冷卻時間結束即可在全球共用畫布畫下像素！</div>
        </div>
    </div>

    <!-- ==========================================
        右側：像素主畫布空間
       ========================================== -->
    <div class="flex-1 flex flex-col relative bg-slate-950 overflow-hidden">
        
        <!-- 浮動抬頭顯示器 (HUD) -->
        <div class="absolute top-4 left-4 right-4 flex items-center justify-between z-10 pointer-events-none">
            <!-- 像素屬性與座標 -->
            <div class="bg-slate-900/90 backdrop-blur px-3 py-2 rounded-lg border border-slate-800 shadow-lg text-xs pointer-events-auto flex items-center gap-4">
                <div class="flex items-center gap-1.5 border-r border-slate-800 pr-3">
                    <span class="text-slate-500">位置:</span>
                    <span id="hud-coordinates" class="font-mono text-yellow-400 font-bold">X: - Y: -</span>
                </div>
                <div id="hud-owner" class="flex items-center gap-2 text-slate-400">
                    選取空白區域
                </div>
            </div>

            <!-- 視角控制器 -->
            <div class="flex gap-2 pointer-events-auto">
                <button id="btn-grid" class="px-3 py-1.5 rounded-lg text-xs font-bold shadow-md transition-colors border bg-slate-900 text-slate-400 border-slate-800">
                    🌐 格線: 隱藏
                </button>
                <button id="btn-center" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 px-3 py-1.5 rounded-lg text-xs font-bold shadow-md transition-colors">
                    🎯 置中
                </button>
            </div>
        </div>

        <!-- 側邊縮放鈕 -->
        <div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-2 z-10">
            <button id="btn-zoom-in" class="w-10 h-10 bg-slate-900/90 hover:bg-slate-800 rounded-lg text-lg font-bold flex items-center justify-center border border-slate-800 shadow-md text-slate-200">＋</button>
            <div id="zoom-indicator" class="bg-slate-900/95 py-1 text-center font-mono text-[9px] text-cyan-400 font-bold rounded border border-slate-800">100%</div>
            <button id="btn-zoom-out" class="w-10 h-10 bg-slate-900/90 hover:bg-slate-800 rounded-lg text-lg font-bold flex items-center justify-center border border-slate-800 shadow-md text-slate-200">－</button>
        </div>

        <!-- 畫布視角容器 (負責 Pan & Zoom) -->
        <div id="canvas-container" class="flex-1 w-full h-full flex items-center justify-center relative cursor-crosshair overflow-hidden">
            <div id="canvas-wrapper" class="shadow-2xl border-4 border-slate-800 relative select-none" style="transform: translate(0px, 0px) scale(4); transform-origin: center center;">
                <canvas id="paint-canvas" width="128" height="128" class="bg-white" style="width: 512px; height: 512px;"></canvas>
            </div>
        </div>

        <!-- 底部署色盤 & 倒數計時區 -->
        <div class="p-4 bg-slate-900 border-t border-slate-800 z-10">
            <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center gap-4 justify-between">
                
                <!-- 像素顏色選取 -->
                <div class="flex flex-col gap-1.5 w-full md:w-auto">
                    <span class="text-[9px] uppercase tracking-wider text-slate-500 font-bold">調色盤 PALETTE (點擊選擇顏色)</span>
                    <div id="palette-container" class="flex flex-wrap gap-1.5 bg-slate-950 p-2 rounded-xl border border-slate-800 max-h-24 overflow-y-auto">
                        <!-- 色塊動態生成 -->
                    </div>
                </div>

                <!-- 冷卻計時器 -->
                <div class="flex items-center gap-4 w-full md:w-auto shrink-0 justify-end">
                    <div class="text-right">
                        <span class="text-[9px] text-slate-500 block uppercase tracking-wider font-bold">落筆冷卻計時</span>
                        <div id="cooldown-text" class="text-lg font-bold font-mono text-green-400">⚡ 準備就緒！</div>
                    </div>
                    <!-- 圓形計時進度圈 -->
                    <div class="relative w-14 h-14 rounded-full bg-slate-950 border border-slate-800 flex items-center justify-center shadow-inner overflow-hidden">
                        <div id="cooldown-fill" class="absolute bottom-0 left-0 right-0 bg-red-600/20 transition-all duration-1000 h-0" style="transform-origin: bottom;"></div>
                        <span id="cooldown-timer" class="text-sm font-bold font-mono z-10 text-green-400">OK</span>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Firebase 模組化導入 & 核心邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. FIREBASE & CLOUD CONFIGURATION (RULE 1, 3)
        // ==========================================
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pixel-war-classic-html';

        // 萬人像素大戰 32 經典飽和色
        const PALETTE = [
            '#FFFFFF', '#E4E4E4', '#888888', '#222222',
            '#FFA7D1', '#E50000', '#E59500', '#A06A42',
            '#E5D900', '#94E044', '#02BE01', '#00D3DD',
            '#0083C7', '#0000EA', '#CF00F1', '#820080',
            '#FFD300', '#FF9F00', '#FF4500', '#900C3F',
            '#4A148C', '#00E676', '#1DE9B6', '#00B0FF',
            '#2979FF', '#651FFF', '#AA00FF', '#FF1744',
            '#F50057', '#FF8F00', '#3E2723', '#000000'
        ];

        const BOARD_SIZE = 128;
        const COOLDOWN_SECONDS = 10;

        // 狀態管理
        let user = null;
        let username = localStorage.getItem('pixel_username') || `玩家_${Math.floor(Math.random() * 9000 + 1000)}`;
        let faction = localStorage.getItem('pixel_faction') || '自由畫家';
        let factionColor = localStorage.getItem('pixel_faction_color') || '#00D3DD';

        let pixels = {};
        let selectedColor = '#E50000';
        let hoveredPixel = null;
        let cooldownTime = 0;
        let cooldownInterval = null;

        // 視角控制
        let zoom = 4;
        let pan = { x: 0, y: 0 };
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let gridVisible = false;
        let soundEnabled = true;

        // DOM 元素引用
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const canvasContainer = document.getElementById('canvas-container');
        
        const inputUsername = document.getElementById('input-username');
        const inputFaction = document.getElementById('input-faction');
        const inputFactionColor = document.getElementById('input-faction-color');
        const syncStatus = document.getElementById('sync-status');
        
        const tabChat = document.getElementById('tab-chat');
        const tabActivity = document.getElementById('tab-activity');
        const tabLeaderboard = document.getElementById('tab-leaderboard');
        const panelChat = document.getElementById('panel-chat');
        const panelActivity = document.getElementById('panel-activity');
        const panelLeaderboard = document.getElementById('panel-leaderboard');

        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const activityList = document.getElementById('activity-list');
        const leaderboardList = document.getElementById('leaderboard-list');

        const hudCoordinates = document.getElementById('hud-coordinates');
        const hudOwner = document.getElementById('hud-owner');
        const btnGrid = document.getElementById('btn-grid');
        const btnCenter = document.getElementById('btn-center');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const zoomIndicator = document.getElementById('zoom-indicator');
        const btnSound = document.getElementById('btn-sound');
        const paletteContainer = document.getElementById('palette-container');

        const cooldownText = document.getElementById('cooldown-text');
        const cooldownTimer = document.getElementById('cooldown-timer');
        const cooldownFill = document.getElementById('cooldown-fill');

        // ==========================================
        // 2. RETRO SOUND SYNTHESIZER (8-bit Web Audio)
        // ==========================================
        function playSynthSound(frequency, duration, type = 'sine') {
            if (!soundEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.warn("無法初始化 Web Audio API:", e);
            }
        }

        // ==========================================
        // 3. AUTHENTICATION ONCE & LISTENERS (RULE 3)
        // ==========================================
        async function initAuthentication() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Firebase Auth 驗證失敗:", error);
            }
        }

        onAuthStateChanged(auth, (firebaseUser) => {
            if (firebaseUser) {
                user = firebaseUser;
                syncStatus.innerText = "● 已連接";
                syncStatus.className = "text-green-400 font-bold";
                startRealtimeSync();
            } else {
                syncStatus.innerText = "○ 連線中...";
                syncStatus.className = "text-amber-400";
            }
        });

        // ==========================================
        // 4. REAL-TIME DATA SYNCING (RULES 1 & 2)
        // ==========================================
        function startRealtimeSync() {
            if (!user) return;

            // A. 即時同步全服像素 (無複合篩選，直接拉取變更)
            const pixelsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'pixels');
            onSnapshot(pixelsCollection, (snapshot) => {
                snapshot.forEach((doc) => {
                    pixels[doc.id] = doc.data();
                });
                renderCanvas();
                updateLeaderboard();
                updateActivityLogs(snapshot);
            }, (error) => {
                console.error("同步像素畫布失敗:", error);
            });

            // B. 即時同步聊天室
            const chatCollection = collection(db, 'artifacts', appId, 'public', 'data', 'chat');
            onSnapshot(chatCollection, (snapshot) => {
                const msgs = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    msgs.push({
                        id: doc.id,
                        ...data,
                        date: data.timestamp ? (data.timestamp.toDate ? data.timestamp.toDate() : new Date()) : new Date()
                    });
                });
                // 內存排序聊天內容 (RULE 2)
                msgs.sort((a, b) => a.date - b.date);
                renderChat(msgs.slice(-40)); // 僅顯示最新 40 則訊息
            }, (error) => {
                console.error("同步聊天室失敗:", error);
            });
        }

        // ==========================================
        // 5. RENDERING ENGINE
        // ==========================================
        function renderCanvas() {
            // 背景底色預設白色
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, BOARD_SIZE, BOARD_SIZE);

            // 繪製每一個像素
            Object.keys(pixels).forEach(key => {
                const [x, y] = key.split('_').map(Number);
                const data = pixels[key];
                ctx.fillStyle = data.color || '#FFFFFF';
                ctx.fillRect(x, y, 1, 1);
            });

            // 格線渲染 (放大到一定程度時顯示)
            if (gridVisible && zoom >= 8) {
                ctx.strokeStyle = 'rgba(100, 100, 100, 0.15)';
                ctx.lineWidth = 0.05;
                for (let i = 0; i <= BOARD_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, BOARD_SIZE);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(BOARD_SIZE, i);
                    ctx.stroke();
                }
            }
        }

        function renderChat(messages) {
            chatMessages.innerHTML = '';
            if (messages.length === 0) {
                chatMessages.innerHTML = `<p class="text-slate-500 text-xs text-center py-6">尚無對話。輸入第一則訊息，召集隊友吧！</p>`;
                return;
            }

            messages.forEach((msg) => {
                const div = document.createElement('div');
                div.className = "bg-slate-950/60 p-2 rounded border-l-4 text-xs text-slate-300";
                div.style.borderLeftColor = msg.factionColor || '#ccc';
                div.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="font-bold text-slate-100">${escapeHtml(msg.username)}</span>
                        <span class="px-1 text-[8px] rounded text-slate-900 font-extrabold" style="background-color: ${msg.factionColor || '#ccc'}">
                            ${escapeHtml(msg.faction || '無陣營')}
                        </span>
                    </div>
                    <p class="text-slate-300 select-text break-all">${escapeHtml(msg.text)}</p>
                `;
                chatMessages.appendChild(div);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function updateActivityLogs(snapshot) {
            activityList.innerHTML = '';
            const list = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.timestamp) {
                    list.push({
                        id: doc.id,
                        ...data,
                        date: data.timestamp.toDate ? data.timestamp.toDate() : new Date()
                    });
                }
            });
            
            // 內存降序排列
            list.sort((a, b) => b.date - a.date);
            const recent = list.slice(0, 15);

            if (recent.length === 0) {
                activityList.innerHTML = `<p class="text-slate-500 text-center py-6">等待玩家下筆...</p>`;
                return;
            }

            recent.forEach((log) => {
                const [x, y] = log.id.split('_');
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-slate-950/40 p-2 rounded border border-slate-800 text-xs";
                div.innerHTML = `
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-sm border border-slate-700 inline-block shrink-0" style="background-color: ${log.color}"></span>
                        <span class="font-bold text-slate-300">${escapeHtml(log.username)}</span>
                        <span class="text-[10px] text-slate-500">於 (${x}, ${y})</span>
                    </div>
                    <span class="text-[9px] px-1 rounded font-semibold" style="background-color: ${log.factionColor}1A; color: ${log.factionColor}">
                        ${escapeHtml(log.faction)}
                    </span>
                `;
                activityList.appendChild(div);
            });
        }

        function updateLeaderboard() {
            leaderboardList.innerHTML = '';
            const factionScores = {};
            let totalPlaced = 0;

            Object.values(pixels).forEach(pixel => {
                const name = pixel.faction || '無陣營';
                totalPlaced++;
                if (!factionScores[name]) {
                    factionScores[name] = { count: 0, color: pixel.factionColor || '#888' };
                }
                factionScores[name].count++;
            });

            const sorted = Object.entries(factionScores)
                .map(([name, d]) => ({ name, ...d }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 10);

            if (sorted.length === 0) {
                leaderboardList.innerHTML = `<p class="text-slate-500 text-center py-6">無領地劃分數據</p>`;
                return;
            }

            sorted.forEach((fac, idx) => {
                const pct = ((fac.count / totalPlaced) * 100).toFixed(1);
                const div = document.createElement('div');
                div.className = "space-y-1";
                div.innerHTML = `
                    <div class="flex justify-between text-xs">
                        <span class="font-bold flex items-center gap-1.5">
                            <span class="text-slate-500">#${idx+1}</span>
                            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${fac.color}"></span>
                            ${escapeHtml(fac.name)}
                        </span>
                        <span class="font-mono text-cyan-400 font-semibold">${fac.count} 點 (${pct}%)</span>
                    </div>
                    <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden">
                        <div class="h-full transition-all duration-500" style="background-color: ${fac.color}; width: ${pct}%"></div>
                    </div>
                `;
                leaderboardList.appendChild(div);
            });
        }

        // ==========================================
        // 6. VIEW NAVIGATION (DRAG, PAN, ZOOM, TOUCH)
        // ==========================================
        function updateTransform() {
            canvasWrapper.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
            zoomIndicator.innerText = `${Math.round(zoom * 25)}%`;
        }

        function handleZoom(amount, isRelative = true) {
            const lastZoom = zoom;
            if (isRelative) {
                zoom = Math.max(1, Math.min(32, zoom * amount));
            } else {
                zoom = Math.max(1, Math.min(32, amount));
            }
            playSynthSound(600 + zoom * 20, 0.04, 'triangle');
            updateTransform();
        }

        // 觸控與滑鼠拖曳
        canvasContainer.addEventListener('mousedown', (e) => {
            if (e.button === 1 || e.button === 2 || e.shiftKey) {
                e.preventDefault();
                isDragging = true;
                dragStart = { x: e.clientX - pan.x, y: e.clientY - pan.y };
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                pan = {
                    x: e.clientX - dragStart.x,
                    y: e.clientY - dragStart.y
                };
                updateTransform();
            } else {
                // Hover 座標計算
                const rect = canvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / (rect.width / BOARD_SIZE));
                const y = Math.floor((e.clientY - rect.top) / (rect.height / BOARD_SIZE));

                if (x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE) {
                    hoveredPixel = { x, y };
                    hudCoordinates.innerText = `X: ${x} Y: ${y}`;
                    const pixel = pixels[`${x}_${y}`];
                    if (pixel) {
                        hudOwner.innerHTML = `
                            <span class="text-slate-500">擁有者:</span>
                            <span class="font-bold text-slate-200">${escapeHtml(pixel.username)}</span>
                            <span class="px-1.5 py-0.5 rounded text-[9px] text-slate-900 font-extrabold" style="background-color: ${pixel.factionColor}">
                                ${escapeHtml(pixel.faction)}
                            </span>
                        `;
                    } else {
                        hudOwner.innerHTML = `<span class="text-slate-500">原始空白畫布 (點擊搶下！)</span>`;
                    }
                } else {
                    hoveredPixel = null;
                }
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // 滾輪縮放
        canvasContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.25 : 0.8;
            handleZoom(factor, true);
        }, { passive: false });

        // 置中
        btnCenter.addEventListener('click', () => {
            zoom = 4;
            pan = { x: 0, y: 0 };
            updateTransform();
            playSynthSound(500, 0.08, 'sine');
        });

        // 格線控制
        btnGrid.addEventListener('click', () => {
            gridVisible = !gridVisible;
            btnGrid.innerText = `🌐 格線: ${gridVisible ? '顯示' : '隱藏'}`;
            btnGrid.className = `px-3 py-1.5 rounded-lg text-xs font-bold shadow-md transition-colors border ${gridVisible ? 'bg-cyan-950 text-cyan-300 border-cyan-800' : 'bg-slate-900 text-slate-400 border-slate-800'}`;
            renderCanvas();
            playSynthSound(700, 0.05, 'sine');
        });

        // Zoom 按鈕
        btnZoomIn.addEventListener('click', () => handleZoom(1.4, true));
        btnZoomOut.addEventListener('click', () => handleZoom(0.7, true));

        // 點擊畫下像素
        canvasContainer.addEventListener('click', (e) => {
            if (e.shiftKey || isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / (rect.width / BOARD_SIZE));
            const y = Math.floor((e.clientY - rect.top) / (rect.height / BOARD_SIZE));

            if (x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE) {
                placePixel(x, y);
            }
        });

        // ==========================================
        // 7. GAME PLAY & COOLDOWN (防作弊落筆)
        // ==========================================
        async function placePixel(x, y) {
            if (!user) return;
            if (cooldownTime > 0) {
                playSynthSound(120, 0.2, 'sawtooth');
                return;
            }

            const pixelKey = `${x}_${y}`;
            const previousData = pixels[pixelKey];

            // 樂觀前端更新 (Optimistic Update)
            pixels[pixelKey] = {
                color: selectedColor,
                username,
                faction,
                factionColor,
                timestamp: { toDate: () => new Date() }
            };
            renderCanvas();
            playSynthSound(800, 0.1, 'sine');

            // 開始冷卻
            startCooldown();

            try {
                // 雲端更新
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'pixels', pixelKey);
                await setDoc(docRef, {
                    color: selectedColor,
                    username,
                    faction,
                    factionColor,
                    timestamp: serverTimestamp()
                });
            } catch (err) {
                console.error("像素落筆同步失敗:", err);
                // 復原
                if (previousData) {
                    pixels[pixelKey] = previousData;
                } else {
                    delete pixels[pixelKey];
                }
                renderCanvas();
            }
        }

        function startCooldown() {
            cooldownTime = COOLDOWN_SECONDS;
            updateCooldownUI();

            if (cooldownInterval) clearInterval(cooldownInterval);
            cooldownInterval = setInterval(() => {
                cooldownTime--;
                updateCooldownUI();
                if (cooldownTime <= 0) {
                    clearInterval(cooldownInterval);
                    playSynthSound(950, 0.08, 'triangle');
                }
            }, 1000);
        }

        function updateCooldownUI() {
            if (cooldownTime > 0) {
                cooldownText.innerText = `⌛ 等待 ${cooldownTime} 秒`;
                cooldownText.className = "text-lg font-bold font-mono text-red-500";
                cooldownTimer.innerText = `${cooldownTime}s`;
                cooldownTimer.className = "text-sm font-bold font-mono z-10 text-red-400";
                cooldownFill.style.height = `${(cooldownTime / COOLDOWN_SECONDS) * 100}%`;
            } else {
                cooldownText.innerText = "⚡ 準備就緒！";
                cooldownText.className = "text-lg font-bold font-mono text-green-400";
                cooldownTimer.innerText = "OK";
                cooldownTimer.className = "text-sm font-bold font-mono z-10 text-green-400";
                cooldownFill.style.height = "0%";
            }
        }

        // ==========================================
        // 8. SIDE PANEL NAVIGATION (Tabs)
        // ==========================================
        function switchTab(activeTabId, activePanel) {
            [tabChat, tabActivity, tabLeaderboard].forEach(tab => {
                tab.classList.remove('border-cyan-500', 'text-cyan-400');
                tab.classList.add('border-transparent', 'text-slate-400');
            });
            activeTabId.classList.add('border-cyan-500', 'text-cyan-400');
            activeTabId.classList.remove('border-transparent', 'text-slate-400');

            [panelChat, panelActivity, panelLeaderboard].forEach(p => p.classList.add('hidden'));
            activePanel.classList.remove('hidden');
            playSynthSound(600, 0.05, 'triangle');
        }

        tabChat.addEventListener('click', () => switchTab(tabChat, panelChat));
        tabActivity.addEventListener('click', () => switchTab(tabActivity, panelActivity));
        tabLeaderboard.addEventListener('click', () => switchTab(tabLeaderboard, panelLeaderboard));

        // ==========================================
        // 9. PROFILE & CHAT HANDLERS
        // ==========================================
        function saveProfile() {
            username = inputUsername.value.trim() || `玩家_${Math.floor(Math.random() * 9000 + 1000)}`;
            faction = inputFaction.value.trim() || '自由畫家';
            factionColor = inputFactionColor.value;

            localStorage.setItem('pixel_username', username);
            localStorage.setItem('pixel_faction', faction);
            localStorage.setItem('pixel_faction_color', factionColor);
        }

        inputUsername.value = username;
        inputFaction.value = faction;
        inputFactionColor.value = factionColor;

        [inputUsername, inputFaction, inputFactionColor].forEach(element => {
            element.addEventListener('change', () => {
                saveProfile();
                playSynthSound(440, 0.08, 'sine');
            });
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text || !user) return;

            chatInput.value = '';
            playSynthSound(1000, 0.05, 'sine');

            try {
                const chatCollection = collection(db, 'artifacts', appId, 'public', 'data', 'chat');
                await addDoc(chatCollection, {
                    text,
                    username,
                    faction,
                    factionColor,
                    timestamp: serverTimestamp()
                });
            } catch (err) {
                console.error("訊息發送失敗:", err);
            }
        });

        // ==========================================
        // 10. GENERATING PALETTE UI & INITIALIZATION
        // ==========================================
        PALETTE.forEach(color => {
            const btn = document.createElement('button');
            btn.style.backgroundColor = color;
            btn.className = `w-6 h-6 md:w-7 md:h-7 rounded-md border border-slate-900 transition-all hover:scale-105 flex items-center justify-center relative select-none`;
            btn.addEventListener('click', () => {
                selectedColor = color;
                document.querySelectorAll('#palette-container button').forEach(b => b.innerHTML = '');
                btn.innerHTML = `<span class="absolute text-[10px] font-bold" style="color: ${color === '#FFFFFF' ? '#000000' : '#FFFFFF'}">✓</span>`;
                playSynthSound(500, 0.04, 'triangle');
            });
            if (color === selectedColor) {
                btn.innerHTML = `<span class="absolute text-[10px] font-bold" style="color: #FFFFFF">✓</span>`;
            }
            paletteContainer.appendChild(btn);
        });

        btnSound.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            btnSound.innerText = `🔊 音效: ${soundEnabled ? '開' : '關'}`;
            btnSound.className = `px-2.5 py-1.5 rounded text-xs transition-colors border ${soundEnabled ? 'bg-cyan-950 text-cyan-400 border-cyan-800 hover:bg-cyan-900' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`;
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 初始化
        initAuthentication();
        updateTransform();
        renderCanvas();
    </script>
</body>
</html>
