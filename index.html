<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素大戰：1000x1000 雲端即時萬人爭霸賽 (r/place)</title>
  <!-- 引入 Tailwind CSS CDN 與 Lucide 圖標 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 隱藏滾動條 */
    body::-webkit-scrollbar {
      display: none;
    }
    body {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col md:flex-row overflow-hidden select-none font-sans">

  <!-- 左側控制面板 (桌面端) / 頂部控制面板 (行動端) -->
  <aside class="w-full md:w-80 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 p-4 flex flex-col justify-between shrink-0 z-10 shadow-xl overflow-y-auto">
    <div>
      <!-- 標題與即時連線狀態 -->
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="flex h-3 w-3 relative">
            <span id="pingRing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
            <span id="statusDot" class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
          </span>
          <h1 class="text-xl font-black tracking-wider text-cyan-400">r/place 雲端即時版</h1>
        </div>
        <span id="connectionStatus" class="text-[10px] bg-slate-950 px-2 py-0.5 rounded border border-slate-800 text-amber-400">連線中...</span>
      </div>

      <!-- 藝術家資訊與在線人數 -->
      <div class="bg-slate-950/50 p-2.5 rounded-lg border border-slate-800 text-xs text-slate-400 mb-4 space-y-1">
        <div class="flex justify-between">
          <span>您的藝術家 ID:</span>
          <span id="artistId" class="font-mono text-cyan-400 select-all">載入中...</span>
        </div>
        <div class="flex justify-between">
          <span>當前地圖像素數:</span>
          <span class="font-mono text-slate-300">1,000,000 (1K x 1K)</span>
        </div>
      </div>

      <!-- 操作模式與工具 -->
      <div class="space-y-3 mb-6">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block">操作工具</span>
        <div class="grid grid-cols-2 gap-2">
          <button id="btnDrawMode" class="flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-medium text-sm transition-all shadow-lg shadow-cyan-900/20 border border-cyan-500">
            <i data-lucide="edit-3" class="w-4 h-4"></i> 著色模式
          </button>
          <button id="btnPanMode" class="flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm transition-all border border-slate-700">
            <i data-lucide="grab" class="w-4 h-4"></i> 拖移模式
          </button>
        </div>
        <p class="text-[11px] text-slate-500 text-center">💡 提示：按住 <kbd class="px-1 bg-slate-800 rounded text-slate-400">Space 空白鍵</kbd> 或滑鼠中鍵可快速拖移！</p>
      </div>

      <!-- 座標跳轉與定位 -->
      <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800 space-y-3 mb-6">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-slate-400">目前游標位置</span>
          <span id="coordDisplay" class="text-xs text-cyan-400 font-mono">(500, 500)</span>
        </div>
        <div class="flex items-center gap-2">
          <input type="number" id="gotoX" placeholder="X (0-999)" min="0" max="999" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-center text-xs text-white font-mono focus:outline-none focus:border-cyan-500">
          <input type="number" id="gotoY" placeholder="Y (0-999)" min="0" max="999" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-1.5 px-2 text-center text-xs text-white font-mono focus:outline-none focus:border-cyan-500">
          <button id="btnGoto" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-lg text-slate-300 border border-slate-700 transition">
            <i data-lucide="locate" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- 模擬 AI 社群繪製 (本地模擬，不影響雲端) -->
      <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800 space-y-3 mb-6">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-slate-400">本地 AI 靈感助手</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="toggleAI" class="sr-only peer">
            <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-300 after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-500"></div>
          </label>
        </div>
        <p class="text-[11px] text-slate-500">開啟後，本地 AI 會在你的畫布視野內隨機繪製斑駁色彩，幫助激發靈感（此動作僅存在於你的瀏覽器，不寫入雲端數據）。</p>
      </div>
    </div>

    <!-- 底部功能按鈕 -->
    <div class="space-y-2 mt-4">
      <button id="btnSave" class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm transition border border-slate-700">
        <i data-lucide="download" class="w-4 h-4"></i> 匯出 1000x1000 完整作品
      </button>
      <button id="btnResetView" class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-slate-850 hover:bg-slate-800 text-slate-400 text-xs transition">
        重設視角至中心
      </button>
    </div>
  </aside>

  <!-- 右側主要畫布工作區 -->
  <main class="flex-1 relative bg-slate-950 flex flex-col justify-between overflow-hidden">
    <!-- 畫布容器 -->
    <div id="canvasContainer" class="flex-1 w-full h-full relative cursor-grab active:cursor-grabbing overflow-hidden">
      <!-- 實際畫布（使用 JS 動態控制 Pan & Zoom） -->
      <canvas id="mainCanvas" class="absolute top-0 left-0 origin-top-left"></canvas>
      
      <!-- 畫布加載中提示 -->
      <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center gap-4 z-20">
        <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
        <p id="loadingText" class="text-sm text-cyan-400 font-bold tracking-widest animate-pulse">正在安全連接雲端像素伺服器...</p>
      </div>

      <!-- 冷卻中顯示的半透明遮罩 -->
      <div id="cooldownTimer" class="absolute top-4 right-4 bg-slate-900/90 border border-slate-800 py-2 px-4 rounded-xl shadow-2xl flex items-center gap-3 z-10 pointer-events-none opacity-0 transition-opacity duration-300">
        <div class="relative w-8 h-8 flex items-center justify-center">
          <svg class="w-full h-full transform -rotate-90">
            <circle cx="16" cy="16" r="14" stroke="#1e293b" stroke-width="3" fill="transparent"/>
            <circle id="cooldownProgress" cx="16" cy="16" r="14" stroke="#ef4444" stroke-width="3" fill="transparent" stroke-dasharray="88" stroke-dashoffset="0"/>
          </svg>
          <span id="cooldownSeconds" class="absolute text-xs font-black text-rose-500">5</span>
        </div>
        <div class="text-left">
          <div class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">冷卻中</div>
          <div class="text-xs text-slate-300">請等待世界重載...</div>
        </div>
      </div>
    </div>

    <!-- 底部調色盤區 -->
    <div class="bg-slate-900 border-t border-slate-800 p-4 flex flex-col items-center gap-3 z-10 shadow-2xl shrink-0">
      <div class="w-full max-w-4xl flex items-center justify-between">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">選擇色彩</span>
        <div class="flex items-center gap-1.5 bg-slate-950/60 px-2 py-1 rounded-lg border border-slate-800">
          <span class="text-[10px] text-slate-500">已選顏色:</span>
          <span id="colorHexText" class="text-xs font-mono text-cyan-400 uppercase">#FF4500</span>
          <span id="colorPreview" class="w-3.5 h-3.5 rounded bg-[#ff4500] border border-white/20"></span>
        </div>
      </div>
      
      <!-- 滾動色塊容器 -->
      <div id="palette" class="w-full max-w-4xl flex gap-2 overflow-x-auto pb-1 justify-start md:justify-center">
        <!-- JS 動態渲染色塊 -->
      </div>
    </div>
  </main>

  <!-- 簡易自定義通知彈窗 -->
  <div id="toast" class="fixed bottom-24 right-4 bg-slate-900 border border-cyan-500/30 text-cyan-400 text-sm py-2 px-4 rounded-xl shadow-2xl pointer-events-none opacity-0 transition-opacity duration-300 z-50 flex items-center gap-2">
    <i data-lucide="info" class="w-4 h-4"></i>
    <span id="toastText">訊息提示</span>
  </div>

  <!-- Firebase 11.6.1 SDK 模組導入 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- 1. 初始化 Lucide 圖標 ---
    lucide.createIcons();

    // --- 2. 遊戲常數設定 ---
    const GRID_SIZE = 1000;       // 1000x1000 百萬畫布
    const CHUNK_SIZE = 100;       // 將畫布分割為 10x10 個 100x100 的分塊(Chunks)
    const COOLDOWN_TIME = 3000;   // 每次繪製的冷卻時間：3 秒 (即時版建議 3 秒以內提高趣味)
    
    // 官方經典 r/place 豐富調色盤
    const COLORS = [
      '#FF4500', '#FFA800', '#FFD635', '#00A368', '#7EED56', '#2450A4', '#3690EA', 
      '#51E9F4', '#811E9F', '#B44AC0', '#FF99AA', '#9C6926', '#000000', '#898D90', '#D4D7D9', '#FFFFFF',
      '#94B3FF', '#493AC1', '#6A5CFF', '#E4ABFF', '#DE1073', '#FF3881', '#941000', '#E50000',
      '#FFB470', '#00756F', '#00CC78', '#008525', '#004313', '#0052FF', '#003056'
    ];
    const uniqueColors = [...new Set(COLORS)];

    // 系統變數
    let activeColor = uniqueColors[0];
    let isDrawMode = true;
    let isSpacePressed = false;

    // 畫布操作狀態 (Pan & Zoom)
    let scale = 1.0;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    // 冷卻與使用者狀態
    let lastPaintTime = 0;
    let cooldownInterval = null;
    let currentUser = null;

    // --- 3. 獲取環境變數與 Firebase 初始化 ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'real-place-game';
    const firebaseConfig = JSON.parse(__firebase_config);
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- 4. 初始化畫布系統 ---
    const mainCanvas = document.getElementById('mainCanvas');
    const mainCtx = mainCanvas.getContext('2d');
    const container = document.getElementById('canvasContainer');

    // 離屏畫布：在記憶體中維護最即時完整的 1000x1000 畫面
    const virtualCanvas = document.createElement('canvas');
    virtualCanvas.width = GRID_SIZE;
    virtualCanvas.height = GRID_SIZE;
    const vCtx = virtualCanvas.getContext('2d');

    // 預先繪製純白底
    vCtx.fillStyle = '#FFFFFF';
    vCtx.fillRect(0, 0, GRID_SIZE, GRID_SIZE);

    // --- 5. Firebase 身份驗證與即時監聽 (核心機制) ---
    const initAuthAndSync = async () => {
      try {
        document.getElementById('loadingText').textContent = "正在取得安全令牌...";
        
        // 優先使用自訂 Custom Token 登入
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.error("Auth failed, retrying anonymous:", error);
        await signInAnonymously(auth);
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('artistId').textContent = user.uid.substring(0, 8) + '...';
        
        // 進入連線成功狀態
        updateStatusIndicator('connected');
        showToast('🟢 雲端同步系統已建立安全連線！', 'success');

        // 開始向 Firestore 進行全圖即時雙向監聽 (Rule 1 & Rule 2)
        startRealtimeListener();
      } else {
        updateStatusIndicator('disconnected');
      }
    });

    // 啟動監聽分塊資料
    function startRealtimeListener() {
      document.getElementById('loadingText').textContent = "正在載入世界像素畫布...";
      
      // 指向嚴格規定的 Public Path (Rule 1)
      const dataCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'chunks');

      // 監聽此集合的任何變化 (Rule 2: 不含任何 compound query)
      onSnapshot(dataCollectionRef, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          const docData = change.doc.data();
          const docId = change.doc.id; // 格式如 chunk_3_4
          
          const parts = docId.split('_');
          if (parts.length === 3 && parts[0] === 'chunk') {
            const cx = parseInt(parts[1]);
            const cy = parseInt(parts[2]);
            
            if (!isNaN(cx) && !isNaN(cy)) {
              renderChunkData(cx, cy, docData.p || {});
            }
          }
        });

        // 首次加載完成後關閉 Loading 遮罩
        const loadingOverlay = document.getElementById('loadingOverlay');
        if (!loadingOverlay.classList.contains('hidden')) {
          loadingOverlay.classList.add('hidden');
          resetViewToCenter();
        }

        draw();
      }, (error) => {
        console.error("Firestore sync error:", error);
        showToast('❌ 同步錯誤，請重整網頁', 'error');
      });
    }

    // 將分塊的像素數據繪製到離屏虛擬畫布上
    function renderChunkData(cx, cy, pixels) {
      const startX = cx * CHUNK_SIZE;
      const startY = cy * CHUNK_SIZE;

      // 清空該分塊區域回白色
      vCtx.fillStyle = '#FFFFFF';
      vCtx.fillRect(startX, startY, CHUNK_SIZE, CHUNK_SIZE);

      // 依序著色有紀錄的像素
      Object.entries(pixels).forEach(([indexStr, color]) => {
        const index = parseInt(indexStr);
        const localX = index % CHUNK_SIZE;
        const localY = Math.floor(index / CHUNK_SIZE);
        
        vCtx.fillStyle = color;
        vCtx.fillRect(startX + localX, startY + localY, 1, 1);
      });
    }

    // 更新連線狀態燈號 UI
    function updateStatusIndicator(status) {
      const statusDot = document.getElementById('statusDot');
      const pingRing = document.getElementById('pingRing');
      const text = document.getElementById('connectionStatus');

      if (status === 'connected') {
        statusDot.className = "relative inline-flex rounded-full h-3 w-3 bg-emerald-500";
        pingRing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
        text.textContent = "即時同步中";
        text.className = "text-[10px] bg-slate-950 px-2 py-0.5 rounded border border-slate-800 text-emerald-400";
      } else if (status === 'disconnected') {
        statusDot.className = "relative inline-flex rounded-full h-3 w-3 bg-rose-500";
        pingRing.className = "";
        text.textContent = "已中斷";
        text.className = "text-[10px] bg-slate-950 px-2 py-0.5 rounded border border-slate-800 text-rose-400";
      }
    }

    // --- 6. 點擊上傳像素至雲端 (Rule 3) ---
    async function uploadPixel(x, y, color) {
      if (!currentUser) {
        showToast('🔒 正在建立雲端連線，請稍後...', 'error');
        return;
      }

      const now = Date.now();
      if (now - lastPaintTime < COOLDOWN_TIME) {
        showToast('🎨 像素冷卻中，請稍候再點擊！', 'error');
        playSynthSound(150, 'triangle', 0.15);
        return;
      }

      // 1. 計算該座標屬於哪個分塊 (Chunk)
      const cx = Math.floor(x / CHUNK_SIZE);
      const cy = Math.floor(y / CHUNK_SIZE);
      const localX = x % CHUNK_SIZE;
      const localY = y % CHUNK_SIZE;
      const localIndex = localY * CHUNK_SIZE + localX;

      const chunkId = `chunk_${cx}_${cy}`;
      
      // 2. 嚴格對準 Public Data Path (Rule 1)
      const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'chunks', chunkId);

      // 本地先繪製，帶來完美即時回饋感 (Optimistic UI Update)
      vCtx.fillStyle = color;
      vCtx.fillRect(x, y, 1, 1);
      draw();
      playSynthSound(600, 'sine', 0.08);
      startCooldown();

      try {
        // 3. 上傳至雲端（使用動態巢狀欄位更新，若無此文檔則自動 merge 建立）
        await setDoc(docRef, {
          p: {
            [localIndex]: color
          }
        }, { merge: true });
        
      } catch (error) {
        console.error("Upload pixel failed:", error);
        showToast('❌ 寫入雲端發生錯誤，請重試', 'error');
      }
    }

    // --- 7. 繪製主畫布 (Pan & Zoom 變換渲染) ---
    function draw() {
      mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      
      mainCtx.save();
      // 應用拖曳與縮放矩陣
      mainCtx.translate(offsetX, offsetY);
      mainCtx.scale(scale, scale);

      // 關閉平滑化，保證乾淨利落的 8-bit 像素邊緣
      mainCtx.imageSmoothingEnabled = false;
      mainCtx.mozImageSmoothingEnabled = false;
      mainCtx.webkitImageSmoothingEnabled = false;
      mainCtx.msImageSmoothingEnabled = false;

      // 繪製離屏緩衝畫布
      mainCtx.drawImage(virtualCanvas, 0, 0);

      // 放大倍率高於 12 時，自動疊加細網格
      if (scale > 12) {
        mainCtx.strokeStyle = 'rgba(0, 0, 0, 0.12)';
        mainCtx.lineWidth = 1 / scale;
        mainCtx.beginPath();
        for (let i = 0; i <= GRID_SIZE; i += 1) {
          mainCtx.moveTo(i, 0);
          mainCtx.lineTo(i, GRID_SIZE);
          mainCtx.moveTo(0, i);
          mainCtx.lineTo(GRID_SIZE, i);
        }
        mainCtx.stroke();
      }

      mainCtx.restore();
    }

    function resizeCanvas() {
      mainCanvas.width = container.clientWidth;
      mainCanvas.height = container.clientHeight;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    function resetViewToCenter() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      scale = Math.min(w, h) / GRID_SIZE * 0.95;
      offsetX = (w - GRID_SIZE * scale) / 2;
      offsetY = (h - GRID_SIZE * scale) / 2;
      draw();
    }

    // --- 8. 拖曳與縮放互動機制 ---
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = mainCanvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const zoomFactor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      const newScale = Math.min(Math.max(scale * zoomFactor, 0.25), 60);

      offsetX = mouseX - ((mouseX - offsetX) / scale) * newScale;
      offsetY = mouseY - ((mouseY - offsetY) / scale) * newScale;
      scale = newScale;

      draw();
    }, { passive: false });

    // 空白鍵快切拖移
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isSpacePressed) {
        isSpacePressed = true;
        setMode(false);
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        isSpacePressed = false;
        if (document.getElementById('btnDrawMode').classList.contains('bg-cyan-600')) {
          setMode(true);
        }
      }
    });

    container.addEventListener('mousedown', (e) => {
      if (e.button === 1 || !isDrawMode || isSpacePressed) {
        isDragging = true;
        startX = e.clientX - offsetX;
        startY = e.clientY - offsetY;
        container.style.cursor = 'grabbing';
        e.preventDefault();
      }
    });

    window.addEventListener('mousemove', (e) => {
      const rect = mainCanvas.getBoundingClientRect();
      const canvasX = Math.floor((e.clientX - rect.left) / scale);
      const canvasY = Math.floor((e.clientY - rect.top) / scale);
      
      if (canvasX >= 0 && canvasX < GRID_SIZE && canvasY >= 0 && canvasY < GRID_SIZE) {
        document.getElementById('coordDisplay').textContent = `(${canvasX}, ${canvasY})`;
      }

      if (isDragging) {
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        draw();
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        container.style.cursor = isDrawMode ? 'crosshair' : 'grab';
      }
    });

    // 處理著色點擊
    container.addEventListener('click', (e) => {
      if (e.button === 0 && isDrawMode && !isSpacePressed) {
        const rect = mainCanvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / scale);
        const y = Math.floor((e.clientY - rect.top) / scale);

        if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
          uploadPixel(x, y, activeColor);
        }
      }
    });

    // --- 9. 冷卻計時器 UI 運作 ---
    function startCooldown() {
      lastPaintTime = Date.now();
      const timerOverlay = document.getElementById('cooldownTimer');
      const progressCircle = document.getElementById('cooldownProgress');
      const secondsSpan = document.getElementById('cooldownSeconds');
      
      timerOverlay.style.opacity = '1';
      
      if (cooldownInterval) clearInterval(cooldownInterval);

      const totalDash = 88;
      let timeLeft = COOLDOWN_TIME / 1000;
      
      secondsSpan.textContent = Math.ceil(timeLeft);
      progressCircle.style.strokeDashoffset = '0';

      cooldownInterval = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) {
          clearInterval(cooldownInterval);
          timerOverlay.style.opacity = '0';
        } else {
          secondsSpan.textContent = Math.ceil(timeLeft);
          const offset = totalDash - (timeLeft / (COOLDOWN_TIME / 1000)) * totalDash;
          progressCircle.style.strokeDashoffset = offset;
        }
      }, 100);
    }

    // --- 10. 本地 AI 靈感助手 (開啟時會在本地渲染) ---
    const aiToggle = document.getElementById('toggleAI');
    setInterval(() => {
      if (!aiToggle.checked) return;

      // 獲取目前視角邊界，讓 AI 剛好畫在螢幕視野內增加互動
      const w = container.clientWidth;
      const h = container.clientHeight;
      const minX = Math.max(0, Math.floor(-offsetX / scale));
      const maxX = Math.min(GRID_SIZE - 1, Math.floor((w - offsetX) / scale));
      const minY = Math.max(0, Math.floor(-offsetY / scale));
      const maxY = Math.min(GRID_SIZE - 1, Math.floor((h - offsetY) / scale));

      if (maxX > minX && maxY > minY) {
        for (let i = 0; i < 3; i++) {
          const rx = minX + Math.floor(Math.random() * (maxX - minX));
          const ry = minY + Math.floor(Math.random() * (maxY - minY));
          const rColor = uniqueColors[Math.floor(Math.random() * uniqueColors.length)];
          
          // 只繪製在本地離屏畫布上，不傳送至雲端 (防止濫用流量)
          vCtx.fillStyle = rColor;
          vCtx.fillRect(rx, ry, 1, 1);
        }
        draw();
      }
    }, 400);

    // --- 11. UI 面板操作控制綁定 ---
    const btnDrawMode = document.getElementById('btnDrawMode');
    const btnPanMode = document.getElementById('btnPanMode');

    function setMode(drawMode) {
      isDrawMode = drawMode;
      if (isDrawMode) {
        btnDrawMode.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-medium text-sm transition-all shadow-lg shadow-cyan-900/20 border border-cyan-500";
        btnPanMode.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm transition-all border border-slate-700";
        container.style.cursor = 'crosshair';
      } else {
        btnDrawMode.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm transition-all border border-slate-700";
        btnPanMode.className = "flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-medium text-sm transition-all shadow-lg shadow-cyan-900/20 border border-cyan-500";
        container.style.cursor = 'grab';
      }
    }

    btnDrawMode.addEventListener('click', () => setMode(true));
    btnPanMode.addEventListener('click', () => setMode(false));

    // 定位與跳轉
    document.getElementById('btnGoto').addEventListener('click', () => {
      const x = parseInt(document.getElementById('gotoX').value);
      const y = parseInt(document.getElementById('gotoY').value);
      if (isNaN(x) || isNaN(y) || x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) {
        showToast('❌ 請輸入 0 - 999 之間的有效座標', 'error');
        return;
      }
      
      scale = 18;
      offsetX = container.clientWidth / 2 - x * scale;
      offsetY = container.clientHeight / 2 - y * scale;
      draw();
      showToast(`📍 已傳送至座標: (${x}, ${y})`, 'success');
    });

    // 下載完整 1000x1000 Png
    document.getElementById('btnSave').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `real_place_canvas_${Date.now()}.png`;
      link.href = virtualCanvas.toDataURL('image/png');
      link.click();
      showToast('💾 成功匯出 1000x1000 百萬像素無損大圖！', 'success');
    });

    // 重設視野
    document.getElementById('btnResetView').addEventListener('click', () => {
      resetViewToCenter();
      showToast('🔄 視野已重設回畫布中央', 'info');
    });

    // --- 12. 動態生成調色盤 UI ---
    const paletteContainer = document.getElementById('palette');
    const colorHexText = document.getElementById('colorHexText');
    const colorPreview = document.getElementById('colorPreview');

    uniqueColors.forEach((color, index) => {
      const btn = document.createElement('button');
      btn.className = `w-8 h-8 rounded-lg border-2 shrink-0 transition-all hover:scale-110 active:scale-95 ${index === 0 ? 'border-white scale-110' : 'border-transparent'}`;
      btn.style.backgroundColor = color;
      btn.addEventListener('click', () => {
        document.querySelectorAll('#palette button').forEach(b => b.classList.remove('border-white', 'scale-110'));
        btn.classList.add('border-white', 'scale-110');
        activeColor = color;
        colorHexText.textContent = color;
        colorPreview.style.backgroundColor = color;
        
        setMode(true);
      });
      paletteContainer.appendChild(btn);
    });

    // --- 13. 微型通知彈出與合成音效 ---
    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toastText');
      text.textContent = msg;
      
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2500);
    }

    let audioCtx = null;
    function playSynthSound(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.type = type;
        osc.frequency.value = freq;
        
        gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // 靜音忽略
      }
    }

    // --- 14. 啟動與初始化 ---
    resizeCanvas();
    initAuthAndSync();
  </script>
</body>
</html>
